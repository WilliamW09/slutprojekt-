<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – AeroTrade</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">AeroTrade</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="marketplace.html">Marketplace</a></li>
                <li><a href="sell.html">Sell Aircraft</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
            <div class="nav-right">
                <a href="login.html" class="login-btn" id="loginNavBtn">Log in</a>
                <a href="contact.html" class="nav-button">Contact</a>
                <div class="user-menu" id="userMenu">
                    <button onclick="logout()" class="logout-btn">Logga ut</button>
                </div>
            </div>
            <button class="hamburger" id="hamburger" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </button>
        </nav>
        <div class="mobile-menu" id="mobileMenu">
            <a href="index.html" onclick="toggleMenu()">Home</a>
            <a href="marketplace.html" onclick="toggleMenu()">Marketplace</a>
            <a href="sell.html" onclick="toggleMenu()">Sell Aircraft</a>
            <a href="about.html" onclick="toggleMenu()">About</a>
            <a href="contact.html" onclick="toggleMenu()">Contact</a>
            <a href="login.html" class="mobile-login" id="mobileLoginBtn" onclick="toggleMenu()">Log in</a>
        </div>
    </header>

    <section class="page-hero">
        <h1>Contact Us</h1>
        <p>Have a question? Our team typically responds within a few hours.</p>
    </section>

    <section class="form-section">
        <div class="form-card">
            <h2>Send a message</h2>
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="contactName" placeholder="John Smith">
                <p class="field-error" id="contactNameError"></p>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="text" id="contactEmail" placeholder="you@example.com">
                <p class="field-error" id="contactEmailError"></p>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea id="contactMessage" placeholder="What can we help you with?"></textarea>
                <p class="field-error" id="contactMessageError"></p>
            </div>
            <button class="primary-btn" style="width: 100%; padding: 14px;" onclick="sendMessage()">Send Message</button>
            <p class="success-msg" id="contactSuccess"></p>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <h3>AeroTrade</h3>
            <p>Premium Swedish aircraft marketplace.</p>
            <p class="copyright">&copy; <span id="copyrightYear"></span> AeroTrade. </p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
